const DEF_GUIDES=[
 {id:'g_bluecut',kind:'note',title:'عدسات Blue Cut',titleEn:'Blue Cut lenses',body:'تحجب جزءاً من الضوء الأزرق الصادر من الشاشات وتقلل الوهج، فتريح العين أثناء استخدام الهاتف والحاسوب. نظّفها بالبخاخ وقطعة المايكروفايبر فقط، وتجنب المناديل الورقية والماء الحار.',bodyEn:'They filter part of the blue light from screens and reduce glare, keeping your eyes comfortable on phones and computers. Clean them only with lens spray and a microfibre cloth; avoid tissues and hot water.'},
 {id:'g_photo',kind:'note',title:'العدسات المتغيرة مع الشمس (Photochromic)',titleEn:'Photochromic lenses',body:'تغمق تلقائياً تحت أشعة الشمس وتعود شفافة في الداخل خلال دقائق، وتحمي من الأشعة فوق البنفسجية. يقل تغميقها داخل السيارة لأن الزجاج يحجب الأشعة، وهذا طبيعي.',bodyEn:'They darken automatically in sunlight and clear indoors within minutes, with full UV protection. They darken less inside a car because the windscreen blocks UV; this is normal.'},
 {id:'g_pal',kind:'note',title:'العدسات التقدمية (Progressive)',titleEn:'Progressive lenses',body:'رؤية واضحة للبعيد والمتوسط والقريب في عدسة واحدة. انظر للبعيد من أعلى العدسة وللقراءة من أسفلها مع تحريك الرأس لا العين فقط، والتعوّد عليها يحتاج من أسبوع إلى أسبوعين.',bodyEn:'Clear distance, intermediate and near vision in one lens. Look through the top for distance and the bottom for reading, turning your head rather than only your eyes; allow one to two weeks to adapt.'},
 {id:'g_care',kind:'note',title:'العناية بالنظارة',titleEn:'Caring for your glasses',body:'البسها واخلعها بكلتا اليدين، وضعها في علبتها وعدساتها للأعلى. لا تتركها في السيارة أو تحت الشمس الحارة، ونظّفها يومياً بالبخاخ وقطعة المايكروفايبر.',bodyEn:'Put them on and take them off with both hands and keep them in their case, lenses up. Do not leave them in a hot car or in the sun, and clean them daily with lens spray and a microfibre cloth.'},
 {id:'g_cl',kind:'note',title:'العدسات اللاصقة',titleEn:'Contact lenses',body:'اغسل يديك قبل لمس العدسات، واستبدلها حسب المدة المحددة، ولا تنم بها أو تسبح بها. اخلعها وراجعنا فوراً عند الاحمرار أو الألم أو تشوش الرؤية.',bodyEn:'Wash your hands before handling lenses, replace them on schedule, and never sleep or swim in them. Remove them and see us at once if you have redness, pain or blurred vision.'},
 {id:'g_dry',kind:'flyer',title:'جفاف العين: نصائح للراحة',titleEn:'Dry eye: tips for comfort',body:'جفاف العين شائع مع الشاشات والمكيفات والغبار، ويظهر كحرقة أو شعور بوجود رمل في العين أو احمرار أو تشوش يتحسن بالرمش.\n• ارمش بوعي وبشكل كامل، خاصة أثناء القراءة واستخدام الشاشات.\n• استخدم القطرات المرطبة الخالية من المواد الحافظة حسب إرشاد الطبيب.\n• ضع كمادات دافئة على الجفون 5 دقائق يومياً ونظّف حافة الجفن بلطف.\n• اشرب كمية كافية من الماء، وأكثر من الأسماك والمكسرات الغنية بأوميغا 3.\n• أبعد هواء المكيف والمروحة عن وجهك، واستخدم جهاز ترطيب في الغرفة.\n• ارتدِ نظارة شمسية في الخارج للحماية من الرياح والغبار.\nراجعنا إذا استمرت الأعراض، أو ترافقت مع ألم شديد أو ضعف مفاجئ في النظر.',bodyEn:'Dry eye is common with screens, air conditioning and dust. It feels like burning, grittiness, redness or blur that clears when you blink.\n• Blink fully and on purpose, especially when reading or using screens.\n• Use preservative-free lubricating drops as advised.\n• Apply a warm compress to the lids for 5 minutes a day and gently clean the lid margins.\n• Drink enough water and eat fish and nuts rich in omega-3.\n• Keep air-conditioner and fan airflow away from your face; use a humidifier.\n• Wear sunglasses outdoors against wind and dust.\nSee us if symptoms persist or come with severe pain or sudden loss of vision.'},
 {id:'g_digital',kind:'flyer',title:'الإجهاد الرقمي وصحة النظر',titleEn:'Digital eye strain',body:'الإجهاد الرقمي هو تعب العين الناتج عن النظر الطويل إلى الشاشات، ويسبب صداعاً وحرقة وتشوشاً وألماً في الرقبة والكتفين.\n• قاعدة 20-20-20: كل 20 دقيقة انظر إلى شيء يبعد 6 أمتار لمدة 20 ثانية.\n• اجعل الشاشة أسفل مستوى العين قليلاً وعلى بُعد ذراع (50–70 سم).\n• اضبط سطوع الشاشة ليناسب إضاءة الغرفة، وكبّر الخط بدل الاقتراب من الشاشة.\n• استخدم نظارتك بالدرجة الصحيحة؛ العدسات المضادة للانعكاس وBlue Cut تقلل الوهج.\n• قلّل الشاشات قبل النوم بساعة لنوم أفضل.\n• افحص نظرك مرة كل سنة على الأقل.',bodyEn:'Digital eye strain is eye fatigue from long screen use. It causes headaches, burning, blur and neck and shoulder pain.\n• 20-20-20 rule: every 20 minutes look at something 6 metres away for 20 seconds.\n• Keep the screen slightly below eye level, an arm’s length away (50–70 cm).\n• Match screen brightness to the room and enlarge text instead of leaning in.\n• Wear glasses with the correct prescription; anti-reflective and Blue Cut lenses reduce glare.\n• Cut screen time in the hour before bed.\n• Have your eyes checked at least once a year.'},
 {id:'g_myopia',kind:'flyer',title:'قصر النظر عند الأطفال: ما يجب أن يعرفه الأهل',titleEn:'Myopia in children: what parents should know',body:'قصر النظر (Myopia) يعني أن الطفل يرى القريب بوضوح والبعيد مشوشاً، لأن العين أطول من الطبيعي فتتكوّن الصورة أمام الشبكية بدل أن تقع عليها.\nلماذا تزداد الدرجة؟ تنمو عين الطفل مع عمره، وكلما استطالت زادت الدرجة. يسرّع ذلك العمل القريب الطويل (الهاتف والأجهزة اللوحية والقراءة القريبة)، وقلة الوقت في الهواء الطلق، ووجود قصر نظر عند أحد الوالدين.\nلماذا هو خطير؟ الدرجات العالية تزيد في الكبر خطر انفصال الشبكية والماء الأزرق (الجلوكوما) والماء الأبيض المبكر وتغيرات الشبكية التي قد تُضعف النظر بشكل دائم.\nكيف نحمي عين الطفل؟\n• ساعتان يومياً على الأقل من اللعب في الهواء الطلق وضوء النهار.\n• تحديد وقت الشاشات واتباع قاعدة 20-20-20، وإبقاء الكتاب والجهاز على بُعد 30–40 سم.\n• لبس النظارة بالدرجة الصحيحة طوال الوقت حسب إرشاد الفاحص.\n• عدسات التحكم بقصر النظر وقطرات الأتروبين المخففة تبطئ زيادة الدرجة؛ اسألنا عن الأنسب لطفلك.\n• فحص النظر كل 6 أشهر لمتابعة تغيّر الدرجة.\nعلامات تستدعي الفحص: الاقتراب من التلفاز، تضييق العينين، فرك العينين، الصداع، أو تراجع المستوى الدراسي.',bodyEn:'Myopia (short-sightedness) means a child sees near objects clearly but distant ones blurred, because the eye is longer than normal and the image falls in front of the retina.\nWhy does it increase? A child’s eye grows with age, and the longer it grows the higher the prescription. Long near work (phones, tablets, close reading), little time outdoors and myopic parents speed this up.\nWhy does it matter? High myopia raises the adult risk of retinal detachment, glaucoma, early cataract and retinal changes that can permanently reduce vision.\nHow to protect your child’s eyes\n• At least two hours a day of outdoor play in daylight.\n• Limit screen time, follow the 20-20-20 rule and keep books and devices 30–40 cm away.\n• Wear glasses with the correct prescription full time as advised.\n• Myopia-control lenses and low-dose atropine drops slow progression; ask us what suits your child.\n• Eye checks every 6 months to track changes.\nSigns to get checked: sitting close to the TV, squinting, eye rubbing, headaches or falling school performance.'}];

function vaLine(va){if(!va)return '';const u=va.ucva||{},b=va.bcva||{},n=va.near||{},ph=va.ph||{};const out=[];
  const pr=(o,ou)=>`<span class="rx"><span class="os">L ${esc(o.os||'—')}</span>${ou&&o.ou?' · OU '+esc(o.ou):''} · <span class="od">R ${esc(o.od||'—')}</span></span>`;
  if(u.od||u.os||u.ou)out.push(`${t('unaided')}: ${pr(u,1)}`);if(ph.od||ph.os)out.push(`PH: ${va.phSame?t('phSame'):pr(ph)}`);if(b.od||b.os)out.push(`${t('aided')}: ${pr(b)}`);if(n.od||n.os||n.ou)out.push(`${t('near')}: ${pr(n,1)}`);return out.join('<br>')}
const hasEye=(o,keys)=>!!o&&['od','os'].some(k=>o[k]&&keys.some(x=>o[k][x]!==''&&o[k][x]!=null));
/* exam summary cards: each eye is a set of small labelled values that wrap inside its half of the card (L left, R right) */
const rxCells=(r,more=[])=>{r=r||{};const c=[['SPH',rxNum(r.sph)||(rxNum(r.cyl)?'Plano':'—')],['CYL',rxNum(r.cyl)||'—']];if(rxNum(r.cyl)&&r.axis!==''&&r.axis!=null)c.push(['AXIS',esc(r.axis)+'°']);return c.concat(more.filter(x=>x[1]!==''&&x[1]!=null))};
const rxPair=fn=>`<div class="rxpair">${['os','od'].map(k=>{const v=fn(k);return `<div class="rxline"><span class="eye ${k}">${k==='od'?'R':'L'}</span>${Array.isArray(v)?`<span class="rxcells">${v.map(([l,x])=>`<span class="rxc"><small>${l}</small><b>${x}</b></span>`).join('')}</span>`:`<span class="rx">${v}</span>`}</div>`}).join('')}</div>`;
function examCard(e){const rd=drName(e.refDoctor);

  return `<article class="panel" style="display:grid;gap:12px">
    <div class="bar"><div><b class="ltr">${e.date||''}</b> <span class="muted">${(()=>{const a=patientAge(byId('patients',e.patientId));return a!==''?'· '+t('age')+' '+a+' ':''})()}${e.examiner?'· '+t('examiner')+': '+esc(e.examiner):''}${multi()?' · '+esc(branch(bid(e)).name):''}</span></div>
      <div class="seg">${rd?`<span class="chip acc">${t('refByP')} د. ${esc(rd)}</span>`:''}${e.followUp?`<span class="chip ${e.followDone?'good':(e.followUp<=today()?'bad':'acc')}">${t('visitOn')} ${e.followUp}${e.followDone?' ✓':''}</span>`:''}

    ${e.complaint?`<div><span class="muted">${t('complaintL')}: </span>${esc(e.complaint)}</div>`:''}
    <div class="grid2" style="gap:12px">
      ${vaLine(e.va)?`<div class="rxcard"><span class="muted" style="font-size:.8rem">${t('vaShort')}</span><div>${vaLine(e.va)}</div></div>`:''}
      ${hasEye(e.old,['sph','cyl','add','va'])?`<div class="rxcard"><span class="muted" style="font-size:.8rem">${t('oldRx')}</span>${rxPair(k=>{const r=e.old[k]||{};return rxCells(r,[['ADD',rxNum(r.add)],['VA',esc(r.va||'')]])})}</div>`:''}
      ${hasEye(e.ar,['sph','cyl'])?`<div class="rxcard"><span class="muted" style="font-size:.8rem">${t('arShort')}</span>${rxPair(k=>rxCells(e.ar[k]))}</div>`:''}
      ${hasRet?`<div class="rxcard"><span class="muted" style="font-size:.8rem">${t('retShort')} · ${esc(cy?(cy[0]==='none'?t('dry'):cy[1]):'')}${ret.wd?' · '+t('wdShort')+' '+esc(ret.wd)+' '+t('cm'):''}</span>
        ${rxPair(k=>rxCells(ret[k]))}${ret.notes?`<div class="muted">${esc(ret.notes)}</div>`:''}</div>`:''}
      ${hasRx?`<div class="rxcard"><span class="muted" style="font-size:.8rem">${t('glassesRx')}${rx.type?' · '+esc(tx(rx.type)):''}</span>
        ${rxPair(k=>{const r=rx[k]||{};return rxCells(r,[['ADD',rxNum(r.add)],['PRISM',r.prism?'Δ'+esc(r.prism):''],['VA',esc(r.va||'')]])})}
        ${pdText(rx).length?`<div class="rx muted" style="direction:ltr;white-space:normal;font-size:.85rem">${esc(pdText(rx).join(' · '))}</div>`:''}${rx.lensRec?`<div class="muted">${esc(rx.lensRec)}</div>`:''}${rx.notes?`<div class="rxnote">📝 ${esc(rx.notes).replace(/\n/g,'<br>')}</div>`:''}</div>`:''}
      ${hasCl?`<div class="rxcard"><span class="muted" style="font-size:.8rem">${t('clShort')}${cl.brand?' · '+esc(cl.brand):''}${cl.modality?' · '+esc(tx(cl.modality)):''}</span>
        ${rxPair(k=>{const c=cl[k]||{};return [['PWR',rxNum(c.pwr)||'—']].concat(c.cyl?[['CYL',rxNum(c.cyl)],['AXIS',esc(c.axis||'')+'°']]:[],[['BC',esc(c.bc||'—')],['DIA',esc(c.dia||'—')]])})}${cl.fit?`<div class="muted">${esc(cl.fit)}</div>`:''}</div>`:''}

  const cell=(eye,[k,,ty],i)=>{const nm=`${prefix}.${eye}.${k}`,v=getP(o,nm)??'',ps=P(3,cs(eye)+i,i+2,ncs(eye));
    if(ty==='va')return `<select class="${eye}" ${ps} name="${nm}" aria-label="${eye} ${k}">${VA.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}</select>`;
    const step=ty==='axis'?'1':ty==='mm'?'0.1':'0.25';return `<input class="${eye}" ${ps} name="${nm}" type="number" inputmode="decimal" step="${step}" ${ty==='axis'?'min="0" max="180"':''} value="${esc(v)}" aria-label="${eye} ${k}">`};

function wirePays(f,pays,cur,tot,onChange,lockN=0){const T=()=>typeof tot==='function'?tot():tot;
  const box=f.querySelector('#payList'),amt=f.querySelector('#np_amt'),pc=f.querySelector('#np_cur');pc.value=cur;const sum=()=>pays.reduce((a,x)=>a+payVal(x),0);
  const draw=()=>{box.innerHTML=pays.length?pays.map((x,i)=>`<div class="row"><span><span class="ltr">${esc(x.date)}</span> · ${boxName(x.method)}</span><span class="seg"><b class="rx">${fmt(x.amount,x.cur||cur)}</b>${(x.cur||cur)!==cur?`<span class="rx muted">≈ ${fmt(payVal(x),cur)}</span>`:''}${i<lockN?'':`<button type="button" class="btn ghost danger sm" data-pi="${i}" aria-label="${t('del')}">✕</button>`}</span></div>`).join(''):`<p class="note">${t('noPays')}</p>`;onChange(sum())};
  box.addEventListener('click',e=>{const b=e.target.closest('[data-pi]');if(b){pays.splice(+b.dataset.pi,1);draw()}});
  const add=()=>{const c=pc.value,a=mny(amt.value,c);if(!a)return true;v=+convCur(a,c,cur,rate()).toFixed(cur==='USD'?2:0);if(v>T()-sum()+(cur==='USD'?0.01:1)){toast(t('overpay'));return false}pays.push({date:f.querySelector('#np_date').value||today(),amount:a,cur:c,rate:rate(),val:Math.min(v,+(T()-sum()).toFixed(2)),method:f.querySelector('#np_method').value});amt.value='';draw();return true};
  f.querySelector('#np_add').onclick=add;amt.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();add()}});
  draw();return{add,sum,fill:()=>{pc.value=cur;amt.value=+Math.max(0,T()-sum()).toFixed(cur==='USD'?2:0);amt.focus()}}}

  {extraFooter:`<button type="button" class="btn primary" id="pvPrint">${t('print')}</button>${downloads?`<button type="button" class="btn" id="pvPdf">${t('pdf')}</button>`:''}${canShare?`<button type="button" class="btn" id="pvShare">${t('sharePdf')}</button>`:''}${waPhone?`<a class="btn wa" href="${esc(waLink(waPhone,waText))}" target="_blank" rel="noopener">${t('sendInvWa')}</a>`:''}`,
   onMount:f=>{const fr=f.querySelector('#pv');f.querySelectorAll('[data-pl]').forEach(bt=>bt.onclick=()=>{pl=bt.dataset.pl;try{localStorage.setItem('eyecon_printLang',pl)}catch(_){}f.querySelectorAll('[data-pl]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.pl===pl));fr.srcdoc=gen()});f.querySelector('#pvPrint').onclick=()=>{try{fr.contentWindow.focus();fr.contentWindow.print()}catch(_){toast(t('printHint'))}};
     const name=(fname||'document')+'.pdf';
     const build=async btn=>{btn.disabled=true;toast(t('pdfWork'));try{return await makePdf(fr)}catch(_){toast(t('pdfFail'));return null}finally{btn.disabled=false}};
     const pd=f.querySelector('#pvPdf');if(pd)pd.onclick=async()=>{const bl=await build(pd);if(!bl)return;try{await downloads.save({filename:name,data:bl})}catch(e){if(e&&e.code&&!['declined','cancelled','canceled'].includes(e.code))toast(t('dlFail'))}};
     const sh=f.querySelector('#pvShare');if(sh)sh.onclick=async()=>{const bl=await build(sh);if(!bl)return;const file=new File([bl],name,{type:'application/pdf'});
       try{if(navigator.canShare({files:[file]})){await navigator.share({files:[file],title:title});return}}catch(e){if(e&&e.name==='AbortError')return}
       if(downloads)try{await downloads.save({filename:name,data:bl})}catch(_){}else toast(t('pdfFail'))}}})}

const isRx=ty=>ty==='lens'||ty==='contact';
const prodKey=i=>i.type==='lens'?['L',i.brand,i.name,i.design,i.material,i.index,i.coating].join('|'):i.type==='contact'?['C',i.brand,i.name,i.modality,i.clType,i.bc,i.dia,i.color].join('|'):i.id;
/* customer-facing description of a spectacle lens product, entered once per product (all its powers share it) */
const lensInfoFor=it=>{if(!it||it.type!=='lens')return '';const k=prodKey(it);return S.items.filter(i=>i.type==='lens'&&prodKey(i)===k&&(i.lensInfo||'').trim()).sort((a,b)=>num(b.lensInfoAt)-num(a.lensInfoAt)).map(i=>i.lensInfo.trim())[0]||''};
const saleLensNotes=s=>{const seen=new Set(),out=[];(s.lines||[]).forEach(l=>{if(l.type&&l.type!=='lens')return;const it=l.itemId?byId('items',l.itemId):(l.nw||null);const info=lensInfoFor(it);if(!info)return;const k=prodKey(it);if(seen.has(k))return;seen.add(k);out.push([prodLabel(it),info])});return out};
function prodLabel(i){const p=[i.brand,i.name].filter(Boolean);if(i.type==='lens'){if(i.design)p.push(t(i.design));if(i.index)p.push(i.index);if(i.coating)p.push(i.coating)}
  if(i.type==='contact'){if(i.modality)p.push(t(i.modality));if(i.clType)p.push(t(i.clType));if(i.color)p.push(i.color)}if(i.type==='frame'&&i.model)p.push(i.model);return p.join(' · ')||tx('t_'+i.type)}
function powLabel(i){if(i.type==='lens')return (rxNum(i.sph)||'0.00')+(num(i.cyl)?' / '+rxNum(i.cyl):'');if(i.type==='contact')return (rxNum(i.power)||'0.00')+(num(i.ccyl)?' / '+rxNum(i.ccyl)+' ×'+(i.caxis||''):'');return ''}
const samePow=(i,a)=>i.type==='lens'?num(i.sph)===num(a.s)&&num(i.cyl)===num(a.c):num(i.power)===num(a.s)&&num(i.ccyl)===num(a.c)&&(!num(a.c)||num(i.caxis)===num(a.a));
function products(items,ty){const m=new Map();items.filter(i=>i.type===ty).forEach(i=>{const k=prodKey(i);if(!m.has(k))m.set(k,i)});return [...m].sort((a,b)=>prodLabel(a[1]).localeCompare(prodLabel(b[1])))}
const branchItems=b=>S.items.filter(i=>bid(i)===b);
const lineRow=(l,mode)=>`<tr class="line" data-item="${esc(l.itemId||'')}" data-key="${esc(l.key)}" data-type="${esc(l.type||'')}" data-pow="${esc(l.pow||'')}" ${l.nw?`data-nw="${esc(JSON.stringify(l.nw))}"`:''}><td><span class="lname">${esc(l.name)}</span>${l.pow?` <span class="rx">${esc(l.pow)}</span>`:''}<br><span class="muted" style="font-size:.78rem">${esc(tx('t_'+l.type))}${mode==='sale'?(l.nw?' · '+t('toOrder'):' · '+t('avail')+': '+fmtN((byId('items',l.itemId)||{}).qty)):l.nw?' · '+t('newVariant'):''}</span></td>

  <div class="fr"><label class="f"><span>${t('matType')}</span><select id="addType">${TYPES.map(k=>`<option value="${k}">${t('t_'+k)}</option>`).join('')}</select></label></div>

  ${mode==='sale'?`<p class="note">${t('priceLocked')}</p>`:''}</fieldset>`}
function wireLines(f,mode,getCur,getBranch,onTotal,getRx,init){
  const body=f.querySelector('#lineBody'),box=f.querySelector('#addBox'),tySel=f.querySelector('#addType');
  const stage=f.querySelector('#stageBox'),lnCnt=f.querySelector('#lnCnt');let staged=null;
  const recalc=()=>{let s=0;const rows=body.querySelectorAll('tr.line');rows.forEach(tr=>{const q=num(tr.querySelector('.lq').value),p=num(tr.querySelector('.lp').value);tr.querySelector('.lt').textContent=fmt(q*p,getCur());s+=q*p});
    if(lnCnt){lnCnt.textContent=rows.length;let e=body.querySelector('tr.nolines');if(!rows.length&&!e)body.insertAdjacentHTML('beforeend',`<tr class="nolines"><td colspan="5" class="muted">${t('noLinesYet')}</td></tr>`);else if(rows.length&&e)e.remove()}onTotal(s)};
  const addRow=l=>{const old=[...body.querySelectorAll('tr.line')].find(r=>r.dataset.key===l.key);if(old){const q=old.querySelector('.lq');q.value=num(q.value)+num(l.qty);old.querySelector('.lp').value=l.cost}else body.insertAdjacentHTML('beforeend',lineRow(l,mode));recalc()};
  const unstage=()=>{staged=null;if(stage){stage.hidden=true;stage.innerHTML=''}};
  const commit=()=>{if(!staged)return true;const q=num(stage.querySelector('#stQ').value);if(q<=0){toast(t('needQty'));stage.querySelector('#stQ').focus();return false}
    addRow({...staged,qty:q,cost:num(stage.querySelector('#stP').value)});unstage();toast(t('lineAdded'));const nx=box.querySelector('#lineQ')||box.querySelector('#addS');if(nx)nx.focus();return true};
  const doStage=l=>{if(staged&&!commit())return;staged=l;
    stage.innerHTML=`<b style="font-weight:600">${t('stageT')}</b><div><span class="lname">${esc(l.name)}</span>${l.pow?` <span class="rx">${esc(l.pow)}</span>`:''} <span class="muted" style="font-size:.78rem">· ${esc(tx('t_'+l.type))}${l.nw?' · '+t('newVariant'):''}</span></div>
      <div class="fr" style="align-items:end"><label class="f"><span>${t('qty')}</span><input id="stQ" type="number" step="1" min="1" value="1"></label><label class="f"><span>${t('unitCost')} (${getCur()})</span><input id="stP" type="number" step="any" value="${esc(l.cost)}"></label><div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn primary" id="stGo">${t('stageGo')}</button><button type="button" class="btn ghost" id="stX">${t('stageX')}</button></div></div>`;
    stage.hidden=false;stage.querySelector('#stGo').onclick=commit;stage.querySelector('#stX').onclick=unstage;const qi=stage.querySelector('#stQ');qi.focus();qi.select()};
  if(stage)stage.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();commit()}});
  f.__stagePending=()=>!!staged;
  body.addEventListener('input',recalc);body.addEventListener('click',e=>{if(e.target.closest('.lx')){e.target.closest('tr').remove();recalc()}});
  const conv=(it,v)=>{const cur=getCur(),x=it.currency===cur?num(v):(cur==='USD'?num(v)/rate():num(v)*rate());return +x.toFixed(cur==='USD'?2:0)};
  const push=(it,ex={})=>{const key=ex.key||it.id;if(stage){doStage({itemId:ex.nw?'':it.id,key,type:it.type,name:prodLabel(it),pow:ex.pow??powLabel(it),nw:ex.nw,cost:conv(it,it.cost)});return}const old=[...body.querySelectorAll('tr.line')].find(r=>r.dataset.key===key);if(old){const q=old.querySelector('.lq');q.value=num(q.value)+1;recalc();return}
    body.insertAdjacentHTML('beforeend',lineRow({itemId:ex.nw?'':it.id,key,type:it.type,name:prodLabel(it),pow:ex.pow??powLabel(it),nw:ex.nw,qty:1,price:conv(it,it.price),cost:conv(it,it.cost)},mode));recalc()};
  const sgLbl=i=>[i.brand,itemLabel(i),i.model,i.color].filter(Boolean).join(' ').toLowerCase();const sgRank=(i,v)=>{const L=sgLbl(i);if(!v)return 1;if(L.startsWith(v))return 4;if(L.split(/[\s·\/\-]+/).some(w=>w.startsWith(v))||(i.sku||'').toLowerCase().startsWith(v))return 3;if(L.includes(v))return 2;const w=v.split(/\s+/).filter(Boolean);return w.length>1&&w.every(x=>L.includes(x))?1:0};
  const draw=()=>{const ty=tySel.value,its=branchItems(getBranch()).filter(i=>i.type===ty),buy=mode==='purchase';
    if(!isRx(ty)){
      box.innerHTML=`<div class="fr" style="align-items:end"><label class="f" style="grid-column:span 2"><span>${t('searchItem')}</span><input id="lineQ" autocomplete="off" placeholder="${t('typeToSearch')}"></label><div><button type="button" class="btn primary" id="lineGo">${t('addLine')}</button></div>${buy?`<div><button type="button" class="btn" id="newIt">${t('newItemBuy')}</button></div>`:''}</div><div id="sugg" class="sugg"></div><div id="nwBox" class="nwbox" hidden></div>${its.length||buy?'':`<p class="note">${t('noStockItems')}</p>`}`;
      const q=box.querySelector('#lineQ'),sg=box.querySelector('#sugg');
      const show=()=>{const v=q.value.trim().toLowerCase();const m=its.map(i=>[i,sgRank(i,v)]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]||sgLbl(a[0]).localeCompare(sgLbl(b[0]))).slice(0,v?12:40).map(x=>x[0]);if(!v&&!m.length){sg.innerHTML='';return}
        sg.innerHTML=m.length?m.map(i=>`<button type="button" class="sgi" data-id="${esc(i.id)}">＋ ${esc([i.brand&&!isRx(i.type)?i.brand:'',itemLabel(i),i.model||''].filter(Boolean).join(' · '))}${mode==='sale'?` <span class="muted">· ${t('avail')}: ${fmtN(i.qty)}</span>`:''}</button>`).join(''):`<p class="note">${t('noMatch')}${buy?' '+t('noMatchBuy'):''}</p>`};
      q.oninput=show;q.onfocus=show;q.onclick=show;sg.onclick=e=>{const b=e.target.closest('.sgi');if(!b)return;q.value='';sg.innerHTML='';if(!stage)q.focus();push(its.find(i=>i.id===b.dataset.id))};

          const nw={type:ty,name:g('name'),brand:g('brand'),sku:g('sku'),price:num(g('price')),currency:getCur()};if(ty==='frame'){nw.model=g('model');nw.color=g('color');nw.size=g('size')}
          push({...nw,id:''},{nw,key:'new|'+Date.now(),pow:''});nb.hidden=true;q.value='';sg.innerHTML=''}}}
      return}
    const prods=products(its,ty);if(!prods.length&&!buy){box.innerHTML=`<p class="note">${t('noProd')}</p>`;return}
    const cl=ty==='contact';const opts=list=>list.map(([k,i])=>`<option value="${esc(k)}">${esc(prodLabel(i))}</option>`).join('');
    box.innerHTML=`<div class="fr" style="align-items:end"><label class="f"><span>${t('searchProd')}</span><input id="prodQ" autocomplete="off" placeholder="${t('typeToSearch')}"></label><label class="f" style="grid-column:span 2"><span>${t('product')}</span><select id="addProd">${opts(prods)}</select></label>${buy?`<div><button type="button" class="btn" id="newProd">${t('newProdBuy')}</button></div>`:''}</div><div id="nwBox" class="nwbox" hidden></div>
      <div class="fr" style="align-items:end"><label class="f"><span>${cl?'PWR':'SPH'}</span><input id="addS" type="number" step="0.25" inputmode="decimal"></label><label class="f"><span>CYL</span><input id="addC" type="number" step="0.25" inputmode="decimal"></label>${cl?`<label class="f"><span>AXIS</span><input id="addA" type="number" step="10" min="0" max="180"></label>`:''}<div style="grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn primary" id="addGo">${t('addThis')}</button>${mode==='sale'&&getRx?`<button type="button" class="btn" id="addRx">${t('addFromRx')}</button>`:''}</div></div>`;

let NT=null,NTk='',ntOpen=false;
function ntState(){const k='eyecon_nt_'+chMe();if(NTk!==k){NTk=k;NT={read:{},pushed:{},init:0};try{Object.assign(NT,JSON.parse(localStorage.getItem(k)||'{}'))}catch(_){}}return NT}
function ntSave(){const n=ntState();['read','pushed'].forEach(m=>{const ks=Object.keys(n[m]);if(ks.length>500)ks.sort((a,b)=>n[m][a]-n[m][b]).slice(0,ks.length-500).forEach(k=>delete n[m][k])});try{localStorage.setItem(NTk,JSON.stringify(n))}catch(_){}}
const ntDay=d=>Date.parse(d+'T08:00:00')||Date.now();
function ntList(){const me=chMe(),td=today(),out=[],add=o=>out.push(o);
  chRooms().forEach(r=>{const ms=S.chat.filter(m=>m.room===r.id&&m._by!==me&&chAt(m)>num(CH_READ[r.id]));if(!ms.length)return;const last=ms.reduce((a,b)=>chAt(b)>chAt(a)?b:a);
    const nm=myName(),ment=nm&&ms.some(m=>(m.text||'').includes('@'+nm)),att=(last.att||[])[0],txt=last.text||(att?(att.kind==='voice'?'🎤 '+t('ntVoice'):att.kind==='image'?'🖼 '+t('ntImage'):'📎 '+(att.name||'')):'');
    add({id:'ch:'+r.id+':'+chAt(last),k:'chat',ic:ment?'📣':'💬',title:(ment?t('ntMention'):t('ntChat'))+' · '+r.name,body:(last._byName?last._byName+': ':'')+txt.slice(0,100)+(ms.length>1?'  (+'+(ms.length-1)+')':''),at:chAt(last),go:{chat:r.id}})});
  if(isDoctor())return out.sort((a,b)=>b.at-a.at);
  S.tasks.filter(k=>inBranch(k)&&k.status!=='done').forEach(k=>{const mine=(k.assignees||[]).includes(me),own=k._by===me;
    if(mine&&k._by&&k._by!==me)add({id:'ta:'+k.id,k:'task',ic:'📌',title:t('ntTaskNew'),body:k.title,at:num(k._at)||ntDay(td),go:{task:k.id}});
    if(mine&&k.due&&k.due<=td)add({id:'td:'+k.id+':'+td,k:'task',ic:k.due<td?'⏰':'📅',title:k.due<td?t('ntTaskLate'):t('ntTaskToday'),body:k.title+' · '+k.due,at:ntDay(td),go:{task:k.id}});
    if(own&&!mine&&k.status==='review')add({id:'tr:'+k.id,k:'task',ic:'👀',title:t('ntTaskReview'),body:k.title,at:num(k._at)||ntDay(td),go:{task:k.id}});
    if(mine||own){const c=(k.comments||[]).filter(c=>c.by!==me).slice(-1)[0];if(c)add({id:'tc:'+k.id+':'+c.at,k:'task',ic:'🗨',title:t('ntTaskCmt')+' · '+k.title,body:(c.name?c.name+': ':'')+(c.text||'').slice(0,100),at:num(c.at),go:{task:k.id}})}});
  const pn=s=>{const p=s.patientId?byId('patients',s.patientId):null;return (p?p.name:(s.customer||t('walkIn')))+' · #'+(s.no||'')};
  openOrders().forEach(s=>{if(s.status==='ready')add({id:'or:'+s.id,k:'order',ic:'👓',title:t('ntReady'),body:pn(s),at:num(s.updatedAt)||ntDay(s.date||td),go:{sale:s.id}});
    else if(s.dueDate&&s.dueDate<td)add({id:'ol:'+s.id+':'+td,k:'order',ic:'⚠️',title:t('ntLate'),body:pn(s)+' · '+s.dueDate,at:ntDay(td),go:{sale:s.id}})});
  followUps().filter(e=>e.followUp<=td).forEach(e=>{const p=byId('patients',e.patientId);add({id:'fu:'+e.id+':'+e.followUp,k:'remind',ic:'🔔',title:t('ntFollow'),body:(p?p.name:'')+' · '+e.followUp,at:ntDay(e.followUp),go:{patient:e.patientId}})});
  const lo=lowStock().length,ex=expiring().length;
  if(lo)add({id:'ls:'+td+':'+lo,k:'stock',ic:'📦',title:t('ntLow'),body:lo+' '+t('ntItems'),at:ntDay(td),go:{tab:'inventory'}});
  if(ex)add({id:'ex:'+td+':'+ex,k:'stock',ic:'🧪',title:t('ntExpiring'),body:ex+' '+t('ntItems'),at:ntDay(td),go:{tab:'inventory'}});
  const old=new Date();old.setDate(old.getDate()-30);const O=iso(old),dl=S.sales.filter(s=>inBranch(s)&&s.date&&s.date<=O&&num(s.total)-num(s.paid)>0.009);
  if(dl.length)add({id:'db:'+dl.length+':'+Math.round(dl.reduce((a,s)=>a+saleIQD(s)*(num(s.total)-num(s.paid))/(num(s.total)||1),0)),k:'remind',ic:'💰',title:t('ntDebts'),body:dl.length+' '+t('invoices'),at:ntDay(td),go:{debts:1}});
  if(db&&canWrite&&S.settings.rateDate!==td)add({id:'rt:'+td,k:'remind',ic:'💱',title:t('ntRate'),body:t('todayRate'),at:ntDay(td),go:{rate:1}});
  return out.sort((a,b)=>b.at-a.at)}
function ntGo(g){ntOpen=false;if(g.chat){view='chat';UI.chatRoom=g.chat;render();return}
  if(g.task){view='tasks';render();const k=byId('tasks',g.task);if(k)taskForm(k);return}
  if(g.sale){const s=byId('sales',g.sale);if(s)saleForm(s);ntRender();return}
  if(g.patient){view='patients';UI.patientId=g.patient;render();window.scrollTo(0,0);return}
  if(g.debts){view='sales';UI.salesPeriod='all';UI.salesUnpaid=true;UI.patientId=null;render();return}
  if(g.rate){rateForm();ntRender();return}
  if(g.tab){view=g.tab;render();window.scrollTo(0,0)}}
const ntAgo=ms=>{const m=Math.round((Date.now()-ms)/60000);if(m<1)return t('ntNow');if(m<60)return m+' '+t('ntMin');const h=Math.round(m/60);if(h<24)return h+' '+t('ntHr');return new Date(ms).toISOString().slice(0,10)};
function ntRender(){try{ntRender0()}catch(e){console.warn('nt',e)}}
function ntRender0(){const b=$('#ntBtn');if(!b)return;const n=ntState(),L=ntList(),un=L.filter(x=>!n.read[x.id]);
  b.querySelector('.ntN').textContent=un.length?(un.length>99?'99+':un.length):'';b.classList.toggle('has',!!un.length);b.setAttribute('aria-label',t('ntTitle')+(un.length?' ('+un.length+')':''));
  const base=document.title.replace(/^\(\d+\+?\) /,'');document.title=(un.length?'('+un.length+') ':'')+base;try{un.length?navigator.setAppBadge&&navigator.setAppBadge(un.length):navigator.clearAppBadge&&navigator.clearAppBadge()}catch(_){}
  ntPush(L);
  const P=$('#ntPanel');P.hidden=!ntOpen;if(!ntOpen)return;if(innerWidth<=600){const r=b.getBoundingClientRect();P.style.top=(r.bottom+8)+'px';P.style.setProperty('--ntTop',(r.bottom+8)+'px')}else P.style.top='';
  const perm='Notification' in window?Notification.permission:'none';
  P.innerHTML=`<div class="ntH"><b>${t('ntTitle')}</b>${un.length?`<button type="button" class="btn sm ghost" data-nt="all">${t('ntReadAll')}</button>`:''}</div>
   ${perm==='default'?`<button type="button" class="btn sm ntDev" data-nt="perm">🔔 ${t('ntDevice')}</button>`:perm==='granted'?`<div class="ntNote">✓ ${t('ntDeviceOn')}</div>`:`<div class="ntNote">${t('ntDeviceNo')}</div>`}
   <div class="ntL">${L.length?L.slice(0,60).map((x,i)=>`<button type="button" class="ntI${n.read[x.id]?'':' un'}" data-ni="${i}"><span class="ntIc">${x.ic}</span><span class="ntT"><b>${esc(x.title)}</b><small>${esc(x.body)}</small><small class="muted">${ntAgo(x.at)}</small></span></button>`).join(''):`<div class="ntE">${t('ntEmpty')}</div>`}</div>`;
  P._list=L}
function ntPush(L){const n=ntState();let ch=false;
  if(!n.init){if(!db||['sales','tasks','chat'].some(c=>loading(c)))return;L.forEach(x=>n.pushed[x.id]=Date.now());n.init=1;ntSave();return}
  const fresh=L.filter(x=>!n.pushed[x.id]&&!n.read[x.id]);if(!fresh.length)return;
  fresh.forEach(x=>{n.pushed[x.id]=Date.now();ch=true;
    let shown=false;try{if(document.hidden&&'Notification' in window&&Notification.permission==='granted'){const no=new Notification(x.title,{body:x.body,tag:x.id});no.onclick=()=>{try{window.focus()}catch(_){}ntRead(x.id);ntGo(x.go);no.close()};shown=true}}catch(_){}
    if(!shown&&!document.hidden&&fresh.length<4)toast(x.ic+' '+x.title+' · '+x.body)});
  if(ch)ntSave()}
function ntRead(id){ntState().read[id]=Date.now();ntSave()}
document.addEventListener('click',e=>{const b=e.target.closest('#ntBtn');if(b){ntOpen=!ntOpen;if(ntOpen)hPush('o');ntRender();return}
  const P=$('#ntPanel');if(!P||P.hidden)return;
  if(!e.target.closest('#ntPanel')){ntOpen=false;ntRender();return}
  const a=e.target.closest('[data-nt]');if(a){if(a.dataset.nt==='all'){(P._list||[]).forEach(x=>ntState().read[x.id]=Date.now());ntSave();ntRender()}
    else if(a.dataset.nt==='perm'){try{Notification.requestPermission().then(()=>ntRender())}catch(_){}}return}
  const it=e.target.closest('[data-ni]');if(it){const x=(P._list||[])[+it.dataset.ni];if(x){ntRead(x.id);ntGo(x.go)}}},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ntOpen){ntOpen=false;ntRender()}});

/* ================= boot ================= */
render();
(async()=>{
  if(!window.claude||!window.claude.use){dbState='none';render();return}
  claude.use('downloads').then(d=>{downloads=d;if(view==='settings')schedule()}).catch(()=>{});
  try{db=await claude.use('db')}catch(_){db=null}
  if(!db){dbState='none';render();return}
  dbState='ok';
  try{const u=await claude.use('user');if(u){const c=await u.can('data.write');if(c===false)canWrite=false;try{isAdmin=!!(await u.canEdit())}catch(_){}}}catch(_){}
  COLS.forEach(c=>db.collection(c).onSnapshot(s=>{S[c]=s.docs.map(d=>({id:d.id,...d.data()}));loaded[c]=true;schedule()},err=>{loaded[c]=true;if(err&&err.code==='revoked')canWrite=false;schedule()}));
  db.collection('settings').onSnapshot(s=>{[SET,LOGO,BRANDS].forEach(o=>Object.keys(o).forEach(k=>delete o[k]));RATE=null;
    s.docs.forEach(d=>{const id=d.id,v=d.data()||{};let m;if(id==='main')SET.main=v;else if(id==='rate')RATE=v;else if(id==='logo')LOGO.main=v;else if(id==='brands')BRANDS.main=v.logos||{};
      else if((m=id.match(/^b_(.+)$/)))SET[m[1]]=v;else if((m=id.match(/^logo_(.+)$/)))LOGO[m[1]]=v;else if((m=id.match(/^brands_(.+)$/)))BRANDS[m[1]]=v.logos||{}});
    applyBranch();try{applyLang()}catch(_){}setTimeout(maybeAskRate,300);const ae=document.activeElement;if(!(ae&&ae.closest&&ae.closest('#setForm')))schedule()},()=>{});
  render();
})();
</script>

</body></html>
