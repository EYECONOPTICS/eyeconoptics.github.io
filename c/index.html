<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تواصل معنا · EYECON OPTICS</title>
<link rel="icon" href="../icons/favicon-32.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="theme-color" content="#026BB2">
<style>
:root{--ink:#0E2236;--mut:#56697D;--line:#D3E4F0;--soft:#EEF6FC;--pri:#026BB2;--bg:#F2F8FC;--card:#fff}
@media (prefers-color-scheme:dark){:root{--ink:#E6EEF5;--mut:#9DB0C2;--line:#24384B;--soft:#14283A;--pri:#5AB0EA;--bg:#0B1724;--card:#112131}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Noto Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;display:flex;justify-content:center;padding:28px 16px}
main{width:100%;max-width:420px;display:grid;gap:14px;align-content:start}
header{text-align:center;display:grid;gap:6px;justify-items:center;margin-bottom:6px}
header img{width:76px;height:76px;border-radius:18px}
h1{margin:0;font-size:1.35rem;letter-spacing:.04em;color:var(--pri);font-family:"Noto Sans",system-ui,sans-serif}
header p{margin:0;color:var(--mut);font-size:.95rem}
a.btn{display:flex;align-items:center;gap:14px;padding:15px 18px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:1.05rem;font-weight:600;transition:transform .1s}
a.btn:active{transform:scale(.98)}
a.btn svg{width:28px;height:28px;flex:none}
a.btn span small{display:block;font-weight:400;color:var(--mut);font-size:.8rem;direction:ltr;text-align:right}
.addr{background:var(--soft);border-radius:14px;padding:12px 16px;color:var(--mut);font-size:.9rem;text-align:center;line-height:1.6}
</style>
</head>
<body>
<main>
  <header>
    <img src="../icons/icon-192.png" alt="">
    <h1>EYECON OPTICS</h1>
    <p>اختر طريقة التواصل معنا</p>
  </header>
  <div id="links"></div>
  <div class="addr">📍 بغداد - حي الجامعة - شارع 66 - مقابل مجمع الكندي الطبي</div>
</main>
<script>
(function(){
  var q=new URLSearchParams(location.search),g=function(k){return (q.get(k)||'').trim()};
  var w=g('w').replace(/\D/g,''),tl=g('t').replace(/\D/g,''),f=g('f'),i=g('i'),m=g('m')||'hnR57UuEoAY4DSh47';
  var full=function(v,base){return /^https?:\/\//i.test(v)?v:base+v.replace(/^@/,'')};
  var local=function(n){return n.indexOf('964')===0?'0'+n.slice(3):n};
  var I={
    wa:'<svg viewBox="0 0 24 24"><path fill="#25D366" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2z"/><path fill="#fff" d="M16.9 14.3c-.3-.1-1.6-.8-1.8-.9-.3-.1-.5-.1-.6.1l-.9 1.1c-.2.2-.3.2-.6.1a6.8 6.8 0 0 1-3.4-3c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-2c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.9 11.9 0 0 0 4.6 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .1-1.2c0-.1-.2-.2-.5-.3z"/></svg>',
    fb:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#1877F2"/><path fill="#fff" d="M13.4 20v-6.3h2.1l.3-2.5h-2.4V9.6c0-.7.2-1.2 1.2-1.2h1.3V6.2a17 17 0 0 0-1.9-.1c-1.9 0-3.2 1.2-3.2 3.3v1.8H8.7v2.5h2.1V20z"/></svg>',
    ig:'<svg viewBox="0 0 24 24"><defs><linearGradient id="g" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#FEDA75"/><stop offset=".35" stop-color="#FA7E1E"/><stop offset=".65" stop-color="#D62976"/><stop offset="1" stop-color="#4F5BD5"/></linearGradient></defs><rect x="1" y="1" width="22" height="22" rx="6" fill="url(#g)"/><rect x="6" y="6" width="12" height="12" rx="3.5" fill="none" stroke="#fff" stroke-width="1.8"/><circle cx="12" cy="12" r="3" fill="none" stroke="#fff" stroke-width="1.8"/><circle cx="16.2" cy="7.8" r="1" fill="#fff"/></svg>',
    map:'<svg viewBox="0 0 24 24"><path fill="#EA4335" d="M12 1.5A7.5 7.5 0 0 0 4.5 9c0 5.6 7.5 13.5 7.5 13.5S19.5 14.6 19.5 9A7.5 7.5 0 0 0 12 1.5z"/><circle cx="12" cy="9" r="2.8" fill="#fff"/></svg>',
    tel:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#026BB2"/><path fill="#fff" d="M9.2 6.5 8 6.4c-.4 0-.9.3-1.1.7-.6 1.2-.4 2.8.8 4.8a13 13 0 0 0 4.3 4.3c2 1.2 3.6 1.4 4.8.8.4-.2.7-.7.7-1.1l-.1-1.2-2.5-1-1.3 1.2a8 8 0 0 1-3.5-3.5l1.2-1.3z"/></svg>'
  };
  var L=[];
  if(w)L.push(['wa','واتساب',local(w),'https://wa.me/'+w]);
  if(f)L.push(['fb','فيسبوك','facebook',full(f,'https://www.facebook.com/')]);
  if(i)L.push(['ig','إنستغرام','@'+i.replace(/^@/,'').replace(/^https?:\/\/(www\.)?instagram\.com\//i,''),full(i,'https://www.instagram.com/')]);
  L.push(['map','موقعنا على الخريطة','Google Maps · Apple Maps',full(m,'https://maps.app.goo.gl/')]);
  if(tl)L.push(['tel','اتصال هاتفي',local(tl),'tel:+'+tl]);else if(w)L.push(['tel','اتصال هاتفي',local(w),'tel:+'+w]);
  var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
  document.getElementById('links').outerHTML='<div style="display:grid;gap:10px">'+L.map(function(x){return '<a class="btn" href="'+esc(x[3])+'" target="_blank" rel="noopener">'+I[x[0]]+'<span>'+esc(x[1])+'<small>'+esc(x[2])+'</small></span></a>'}).join('')+'</div>';
})();
</script>
</body>
</html>
